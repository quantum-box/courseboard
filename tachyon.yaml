apiVersion: apps.tachy.one/v1alpha
kind: CloudApps
metadata:
  name: tachyonfield-golf
  tenantId: tn_01ks18jhh1xvggktfzjx5jqsen
spec:
  apps:
    - name: tachyonfield-golf
      repository:
        url: https://github.com/quantum-box/courseboard
        owner: quantum-box
        name: courseboard
        defaultBranch: main
      rootDirectory: ""
      framework: cargo_lambda
      deploymentTarget: lambda
      build:
        package: tachyonfield-golf
        binary: lambda-tachyonfield-golf
        release: true
        arch: arm64
      envVars:
        - name: DATABASE_URL
          value: sqlite:///tmp/tachyonfield-golf.db
        - name: TACHYON_AUTH_ISSUER_URL
          value: https://cognito-idp.ap-northeast-1.amazonaws.com/ap-northeast-1_8Ga4bK5M4
        - name: EXPECTED_AUDIENCE
          value: 5002hok6cj8mjmt3gepdpdq98i
        - name: EXPECTED_CLIENT_ID
          value: 5002hok6cj8mjmt3gepdpdq98i

    # --- Frontend (admin UI) — Cloudflare Workers. vinext app copied into apps/admin-ui.
    # Backend stays AWS Lambda above; this is a separate Cloudflare Worker deploy.
    # Auth is handled by the Cloud App PLATFORM (auth.enabled below), NOT by the app:
    # no per-app Cognito client, no callback URL. Login happens at the platform
    # (app.txcloud.app); golfadmin.txcloud.app (and preview envs) are gated automatically.
    - name: golfadmin
      repository:
        url: https://github.com/quantum-box/courseboard
        owner: quantum-box
        name: courseboard
        defaultBranch: main
      rootDirectory: apps/admin-ui
      framework: worker
      deploymentTarget: cloudflare_workers
      # Platform-handled login (per Ao) — Cloud App standard. When enabled, the
      # platform auto-creates the `golfadmin-web` OAuth2 client on the Tachyon
      # user pool, auto-registers callbacks
      #   https://golfadmin.txcloud.app/api/auth/callback/tachyon (+ pr previews),
      # and injects clientId/clientSecret/userPoolId env vars; txcloud-proxy then
      # gates access by the NextAuth session cookie. No manual Cognito client /
      # callback registration.
      # FOLLOW-UP (app code): the copied admin-ui uses the NextAuth "cognito"
      # provider (callback /api/auth/callback/cognito). To match the platform it
      # must use provider id "tachyon" (callback /api/auth/callback/tachyon)
      # pointed at the Tachyon user pool, reading the injected client env vars.
      # The exact `auth.env` mapping may also be required — validate against the
      # platform / with Ao.
      auth:
        enabled: true
      watchPaths:
        - apps/admin-ui/**
      build:
        # pnpm (matches source admin-ui). Native build scripts are approved via
        # apps/admin-ui/pnpm-workspace.yaml (allowBuilds); pnpm-lock.yaml pins deps.
        installCommand: corepack enable && corepack pnpm install --frozen-lockfile
        command: corepack pnpm run build
        outputDirectory: apps/admin-ui/dist/server/index.js
        nodeVersion: "24"
      envVars:
        - name: ROOT_DIRECTORY
          value: apps/admin-ui
        - name: PACKAGE_NAME
          value: courseboard-admin-ui
        - name: OUTPUT_DIR
          value: apps/admin-ui/dist/server/index.js
        - name: TACHYON_DEPLOYMENT_TARGET
          value: cloudflare_workers
        - name: NEXT_PUBLIC_SITE_NAME
          value: Course Board
        - name: NEXT_PUBLIC_PLATFORM_ID
          value: tn_01ks18jhh1xvggktfzjx5jqsen
        - name: AUTH_BACKEND_API_URL
          value: https://api.n1.tachy.one
        - name: TACHYON_API_URL
          value: https://api.n1.tachy.one
        - name: NEXT_PUBLIC_TACHYON_API_URL
          value: https://api.n1.tachy.one
        - name: COGNITO_ISSUER
          value: https://cognito-idp.ap-northeast-1.amazonaws.com/ap-northeast-1_8Ga4bK5M4
        - name: COGNITO_DOMAIN
          value: https://auth-pool.n1.tachy.one
        - name: COGNITO_REGION
          value: ap-northeast-1
        - name: COGNITO_CLIENT_ID
          type: credential
          valueFrom:
            oauth2ClientRef:
              name: golfadmin-web
              field: clientId
        - name: AUTH_SECRET
          type: credential
          valueFrom:
            secret: golfadmin/AUTH_SECRET
        - name: NEXTAUTH_SECRET
          type: credential
          valueFrom:
            secret: golfadmin/NEXTAUTH_SECRET
        - name: COGNITO_CLIENT_SECRET
          type: credential
          valueFrom:
            oauth2ClientRef:
              name: golfadmin-web
              field: clientSecret
        # Golf ERP endpoints currently live in tachyonfield's Field API; point the frontend there.
        - name: NEXT_PUBLIC_BACKEND_API_URL
          value: https://tachyon-field-api.txcloud.app
        - name: TACHYON_FIELD_API_URL
          value: https://tachyon-field-api.txcloud.app
        - name: BACKEND_API_URL
          value: https://tachyon-field-api.txcloud.app
---
apiVersion: apps.tachy.one/v1alpha
kind: OAuth2Client
metadata:
  name: golfadmin-web
  tenantId: tn_01ks18jhh1xvggktfzjx5jqsen
spec:
  redirectUris:
    - https://golfadmin.txcloud.app/api/auth/callback/tachyon
    - https://*--golfadmin.txcloud.app/api/auth/callback/tachyon
    - https://*.golfadmin.txcloud.app/api/auth/callback/tachyon
  allowedScopes:
    - openid
    - profile
    - email
    - aws.cognito.signin.user.admin
  grantTypes:
    - authorization_code
    - password
  useTachyonUserPool: true
