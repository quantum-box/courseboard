apiVersion: apps.tachy.one/v1alpha
kind: CloudApps
metadata:
  name: courseboard
  tenantId: tn_01ks18jhh1xvggktfzjx5jqsen
spec:
  apps:
    # --- React/Tauri frontend web host — Cloudflare Workers.
    # Golf ERP data stays in the existing tachyon-field-api CloudApp; this
    # manifest only provisions the courseboard admin UI.
    # Cognito/Auth.js and the Field API BFF live in desktop/web-host. The shared
    # desktop React build is copied into that same-origin host at build time.
    - name: courseboard
      repository:
        url: https://github.com/quantum-box/courseboard
        owner: quantum-box
        name: courseboard
        defaultBranch: main
      rootDirectory: desktop/web-host
      framework: worker
      deploymentTarget: cloudflare_workers
      # Do not put the Cloud App login gateway in front of Auth.js. The web host
      # owns /api/auth/* and uses the explicit courseboard-web OAuth2 client.
      auth:
        enabled: false
      watchPaths:
        - desktop/web-host/**
        - desktop/**
      build:
        # pnpm builds the web host; npm builds the shared React/Tauri frontend.
        # Keep pnpm's SQLite store index Pod-local. The runner cache PVC is shared
        # by concurrent builds for this app and a malformed index blocks all reruns.
        installCommand: corepack enable && pnpm_config_store_dir=/tmp/tachyon-pnpm-store corepack pnpm install --frozen-lockfile && cd .. && npm ci --no-audit --no-fund
        command: cd .. && VITE_BASE_PATH=/courseboard-ui/ npm run build && rm -rf web-host/public/courseboard-ui && mkdir -p web-host/public/courseboard-ui && cp -R dist/. web-host/public/courseboard-ui/ && cd web-host && corepack pnpm run build
        outputDirectory: desktop/web-host/dist/server/index.js
        nodeVersion: "24"
      envVars:
        - name: ROOT_DIRECTORY
          value: desktop/web-host
        - name: PACKAGE_NAME
          value: courseboard-web-host
        - name: OUTPUT_DIR
          value: desktop/web-host/dist/server/index.js
        - name: TACHYON_DEPLOYMENT_TARGET
          value: cloudflare_workers
        - name: COURSEBOARD_REACT_ROOT
          value: "true"
        - name: NEXT_PUBLIC_SITE_NAME
          value: Course Board
        - name: NEXT_PUBLIC_SITE_URL
          value: https://courseboard.txcloud.app
        - name: AUTH_URL
          value: https://courseboard.txcloud.app
        - name: NEXTAUTH_URL
          value: https://courseboard.txcloud.app
        - name: NEXT_PUBLIC_PLATFORM_ID
          value: tn_01ks18jhh1xvggktfzjx5jqsen
        - name: AUTH_BACKEND_API_URL
          value: https://api.n1.tachy.one
        - name: TACHYON_API_URL
          value: https://api.n1.tachy.one
        - name: NEXT_PUBLIC_TACHYON_API_URL
          value: https://api.n1.tachy.one
        - name: COGNITO_ISSUER
          value: https://cognito-idp.ap-northeast-1.amazonaws.com/ap-northeast-1_8Ga4bK5M4
        - name: COGNITO_DOMAIN
          value: https://auth-pool.n1.tachy.one
        - name: COGNITO_REGION
          value: ap-northeast-1
        # COGNITO_CLIENT_ID / COGNITO_CLIENT_SECRET / AUTH_SECRET /
        # NEXTAUTH_SECRET remain direct encrypted Cloud App env values. Keeping
        # them outside manifest reconciliation avoids rotating active sessions.
        # Golf ERP endpoints currently live in tachyonfield's Field API; point the frontend there.
        - name: NEXT_PUBLIC_BACKEND_API_URL
          value: https://tachyon-field-api.txcloud.app
        - name: TACHYON_FIELD_API_URL
          value: https://tachyon-field-api.txcloud.app
        - name: BACKEND_API_URL
          value: https://tachyon-field-api.txcloud.app
      environments:
        preview:
          envVars:
            - name: ROOT_DIRECTORY
              value: desktop/web-host
            - name: PACKAGE_NAME
              value: courseboard-web-host
            - name: OUTPUT_DIR
              value: desktop/web-host/dist/server/index.js
            - name: TACHYON_DEPLOYMENT_TARGET
              value: cloudflare_workers
            - name: NEXT_PUBLIC_SITE_NAME
              value: Course Board
            - name: NEXT_PUBLIC_PLATFORM_ID
              value: tn_01ks18jhh1xvggktfzjx5jqsen
            - name: AUTH_BACKEND_API_URL
              value: https://api.n1.tachy.one
            - name: TACHYON_API_URL
              value: https://api.n1.tachy.one
            - name: NEXT_PUBLIC_TACHYON_API_URL
              value: https://api.n1.tachy.one
            - name: COGNITO_ISSUER
              value: https://cognito-idp.ap-northeast-1.amazonaws.com/ap-northeast-1_8Ga4bK5M4
            - name: COGNITO_DOMAIN
              value: https://auth-pool.n1.tachy.one
            - name: COGNITO_REGION
              value: ap-northeast-1
            - name: COGNITO_CLIENT_ID
              type: credential
              valueFrom:
                oauth2ClientRef:
                  name: courseboard-web
                  field: clientId
            - name: COGNITO_CLIENT_SECRET
              type: credential
              valueFrom:
                oauth2ClientRef:
                  name: courseboard-web
                  field: clientSecret
            - name: NEXT_PUBLIC_BACKEND_API_URL
              value: https://tachyon-field-api.txcloud.app
            - name: TACHYON_FIELD_API_URL
              value: https://tachyon-field-api.txcloud.app
            - name: BACKEND_API_URL
              value: https://tachyon-field-api.txcloud.app
