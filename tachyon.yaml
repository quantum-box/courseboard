apiVersion: apps.tachy.one/v1alpha
kind: CloudApps
metadata:
  name: tachyonfield-golf
  tenantId: tn_01ks18jhh1xvggktfzjx5jqsen
spec:
  apps:
    - name: tachyonfield-golf
      repository:
        url: https://github.com/quantum-box/courseboard
        owner: quantum-box
        name: courseboard
        defaultBranch: main
      rootDirectory: ""
      framework: cargo_lambda
      deploymentTarget: lambda
      build:
        package: courseboard
        binary: lambda-courseboard
        release: true
        arch: arm64
      envVars:
        - name: DATABASE_URL
          value: sqlite:///tmp/courseboard.db
        - name: TACHYON_AUTH_ISSUER_URL
          value: https://cognito-idp.ap-northeast-1.amazonaws.com/ap-northeast-1_8Ga4bK5M4
        - name: EXPECTED_AUDIENCE
          value: 5002hok6cj8mjmt3gepdpdq98i
        - name: EXPECTED_CLIENT_ID
          value: 5002hok6cj8mjmt3gepdpdq98i
