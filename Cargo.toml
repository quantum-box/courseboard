[package]
name = "courseboard"
version = "0.1.14"
edition = "2021"
default-run = "courseboard"

[dependencies]
anyhow = "1.0"
axum = { version = "0.7", features = ["multipart"] }
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10"
calamine = { version = "0.36.0", default-features = false }
clap = { version = "4.5", features = ["derive", "env"] }
derive-getters = { version = "0.5", features = ["auto_copy_getters"] }
dotenvy = "0.15"
field-sdk = { git = "https://github.com/quantum-box/field-sdk", rev = "0df2300dc30c24aec505383c0ff9336c9f015b27" }
futures = { version = "0.3", default-features = false, features = ["std"] }
jsonwebtoken = "9.3"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "mysql", "macros", "migrate", "chrono"] }
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "signal", "net", "sync", "time"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["catch-panic", "cors", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "5", features = ["chrono", "axum_extras"] }
utoipa-swagger-ui = { version = "8.1", features = ["axum", "vendored"] }
lambda_http = "0.13"

[[bin]]
name = "lambda-courseboard"
path = "bin/lambda.rs"

[[bin]]
name = "courseboard-migrate"
path = "bin/migrate.rs"

[[bin]]
name = "courseboard-migrate-reservation-reports"
path = "bin/migrate_reservation_reports.rs"

[dev-dependencies]
base64 = "0.22"
http-body-util = "0.1"
rsa = "0.9"
