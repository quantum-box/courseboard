query getConsumerOrdersForAdmin(
  $userId: String
  $sessionId: String
  $limit: Int = 20
  $offset: Int = 0
) {
  consumerOrders(
    userId: $userId
    sessionId: $sessionId
    limit: $limit
    offset: $offset
  ) {
    items {
      id
      tenantId
      cartId
      userId
      sessionId
      status
      fulfillmentMethod
      shippingName
      customerEmail
      customerId
      customerName
      salesChannel
      salesChannelDetail
      sourceMedium
      sourceCampaign
      subtotalNanodollar
      shippingFeeNanodollar
      totalNanodollar
      items {
        id
        productId
        productName
        quantity
        unitPriceNanodollar
        subtotalNanodollar
      }
      pickupDeadline
      confirmedAt
      cancelledAt
      createdAt
      updatedAt
    }
    limit
    offset
  }
}
