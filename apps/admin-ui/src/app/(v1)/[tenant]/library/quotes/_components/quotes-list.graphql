query QuotesList {
  quotes {
    ...QuoteListItem
  }
}

fragment QuoteListItem on Quote {
  id
  title
  status
  clientId
  client {
    id
    name
  }
  subtotal
  tax
  total
  orderDate
  lineItems {
    id
    name
    unitPrice
    quantity
  }
  createdAt
}

mutation CreateQuotePdf($quoteId: ID!) {
  createQuotePdf(quoteId: $quoteId) {
    signedUrl
    expiresAt
  }
}
