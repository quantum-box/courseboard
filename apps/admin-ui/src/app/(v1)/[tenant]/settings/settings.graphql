query GetProviderConfigForSettings($operatorId: ID!) {
  providerConfigHierarchy(operatorId: $operatorId) {
    tenantId
    providers {
      name
      providerType
      definedAt
      hasSecrets
    }
    inheritedFrom
    systemTenantId
  }
  connectedOauthProviders(operatorId: $operatorId)
}
