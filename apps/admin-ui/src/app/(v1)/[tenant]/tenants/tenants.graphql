fragment TenantListItem on Operator {
  id
  name
  operatorName
  platformTenantId
  createdAt
  updatedAt
}

query TenantListPage {
  operators {
    ...TenantListItem
  }
}

mutation CreateOperator($input: CreateOperatorInput!) {
  createOperator(input: $input) {
    id
    name
    operatorName
  }
}

mutation DeleteOperator($id: ID!) {
  deleteOperator(id: $id)
}
