query getInventoryList($limit: Int = 20, $offset: Int = 0) {
  storefrontProducts(limit: $limit, offset: $offset) {
    items {
      id
      name
      kind
      imageIds
    }
    limit
    offset
  }
}

query getProductStockForList($productId: ID!) {
  productStock(productId: $productId) {
    id
    productId
    quantityOnHand
    quantityReserved
    quantityAvailable
    lowStockThreshold
    trackInventory
  }
}
