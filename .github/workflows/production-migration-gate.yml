name: Production migration gate

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - bin/**
      - migrations/**
      - src/**
      - tachyon.yaml
      - desktop/scripts/run-courseboard-with-env.sh
      - .github/workflows/production-migration-gate.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # GitHub keeps at most one pending run per group even when
  # cancel-in-progress is false. A global/main-scoped group would therefore
  # cancel an older pending SHA and make its sameCommit release check
  # impossible forever. Keep each commit independent here; SQLx serializes
  # actual database mutation with the target DB's advisory migration lock.
  group: courseboard-production-migration-gate-${{ github.sha }}
  cancel-in-progress: false

jobs:
  main_ref_guard:
    name: Reject non-main production migration refs
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require main
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::Production migrations may run only from refs/heads/main (got ${GITHUB_REF})."
            exit 1
          fi

  migration_gate:
    name: Validate and apply production migrations
    needs: main_ref_guard
    if: needs.main_ref_guard.result == 'success' && github.ref == 'refs/heads/main'
    environment: production-migrations
    runs-on: tachyoncloud-4vcpu
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Require environment-scoped production DB credential
        env:
          DATABASE_URL: ${{ secrets.TACHYON_COURSEBOARD_PROD_DATABASE_URL }}
        run: |
          if [[ -z "${DATABASE_URL}" ]]; then
            echo "::error::production-migrations environment secret TACHYON_COURSEBOARD_PROD_DATABASE_URL is not configured."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: courseboard-production-migrations

      - name: Run migration gate against production
        env:
          DATABASE_URL: ${{ secrets.TACHYON_COURSEBOARD_PROD_DATABASE_URL }}
        run: cargo run --bin courseboard-migrate

  production_migration_gate:
    name: CourseBoard production migration gate
    needs: migration_gate
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail closed unless migration gate succeeded
        env:
          MIGRATION_GATE_RESULT: ${{ needs.migration_gate.result }}
        run: |
          if [[ "${MIGRATION_GATE_RESULT}" != "success" ]]; then
            echo "::error::Production deploy is refused because the migration gate is ${MIGRATION_GATE_RESULT}."
            exit 1
          fi
          echo "CourseBoard production migration gate is green for ${GITHUB_SHA}."
