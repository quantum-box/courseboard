apiVersion: apps.tachy.one/v1alpha
kind: OAuth2Client
metadata:
  name: courseboard-local-pkce
  tenantId: tn_01ks18jhh1xvggktfzjx5jqsen
spec:
  # Secretless public Cognito client used directly by the local React/Tauri form.
  # The redirect URI is retained only because the provisioning schema requires one.
  clientType: public
  redirectUris:
    - http://127.0.0.1:5173/oauth/callback
  allowedScopes:
    - openid
    - profile
    - email
  grantTypes:
    - password
    - refresh_token
  useTachyonUserPool: true
