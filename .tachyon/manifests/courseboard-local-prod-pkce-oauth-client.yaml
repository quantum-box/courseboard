apiVersion: apps.tachy.one/v1alpha
kind: OAuth2Client
metadata:
  name: courseboard-local-prod-pkce
  tenantId: tn_01ks18jhh1xvggktfzjx5jqsen
spec:
  # Secretless public Cognito client used directly by the React/Tauri form.
  # courseboard-api validates the Cognito issuer and this client id.
  clientType: public
  redirectUris:
    - http://127.0.0.1:5173/oauth/callback
    # Provisioning schema compatibility only; direct auth does not redirect.
    - https://courseboard.txcloud.app/oauth/callback
  allowedScopes:
    - openid
    - profile
    - email
  grantTypes:
    - password
    - refresh_token
  useTachyonUserPool: true
