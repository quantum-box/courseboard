actions:
- context: field_extension_golf
  name: ListTeeSheet
  description: Reading the tee sheet and the ledger behind it.
  global: true
- context: field_extension_golf
  name: ManageReservations
  description: Taking, moving, and cancelling bookings.
  global: true
- context: field_extension_golf
  name: ListSlotOverrides
  description: Reading the desk's manual open/close overrides on tee times.
  global: true
- context: field_extension_golf
  name: ManageSlotOverrides
  description: Opening and closing tee times by hand.
  global: true
- context: field_extension_golf
  name: ListCourses
  description: Reading courses, their order, resources, and schedules.
  global: true
- context: field_extension_golf
  name: ManageCourses
  description: Creating and editing courses, their order, resources, schedules, and how far ahead booking is open.
  global: true
- context: field_extension_golf
  name: ListProducts
  description: Reading the plans sold on the tee sheet and their slots.
  global: true
- context: field_extension_golf
  name: ManageProducts
  description: Editing the plans sold on the tee sheet and their slots.
  global: true
- context: field_extension_golf
  name: ListReservationPolicy
  description: Reading the booking rules the desk works under.
  global: true
- context: field_extension_golf
  name: ManageReservationPolicy
  description: Changing the booking rules, including the golf extension's own config.
  global: true
- context: field_extension_golf
  name: ListCustomers
  description: Reading the customer ledger.
  global: true
- context: field_extension_golf
  name: ManageCustomers
  description: Registering customers and drafting a reception sheet.
  global: true
- context: field_extension_golf
  name: ListMembership
  description: Reading membership plans and who holds one.
  global: true
- context: field_extension_golf
  name: ManageMembershipPlans
  description: Defining the membership plans a club sells.
  global: true
- context: field_extension_golf
  name: AssignMembership
  description: Putting a customer on a membership plan.
  global: true
- context: field_extension_golf
  name: ListCaddies
  description: Reading the caddie roster and which courses each caddie works.
  global: true
- context: field_extension_golf
  name: ManageCaddies
  description: Editing the caddie roster and course assignments.
  global: true
- context: field_extension_golf
  name: ListCaddieAssignments
  description: Reading who is on which round.
  global: true
- context: field_extension_golf
  name: ManageCaddieAssignments
  description: Putting caddies on rounds, by hand or by the auto-placement.
  global: true
- context: field_extension_golf
  name: ListCaddieAvailability
  description: Reading who said they can work, and by when they had to say.
  global: true
- context: field_extension_golf
  name: ManageCaddieAvailability
  description: Recording availability and setting the deadline for it.
  global: true
- context: field_extension_golf
  name: ListShifts
  description: Reading shift plans and the rules they are generated under.
  global: true
- context: field_extension_golf
  name: ManageShifts
  description: Generating and editing shift plans, and the rules behind them.
  global: true
- context: field_extension_golf
  name: ListCaddieInsights
  description: Reading attendance, supply, reinforcement, and rating figures.
  global: true
- context: field_extension_golf
  name: ListCaddieRankFees
  description: Reading what each caddie grade is paid.
  global: true
- context: field_extension_golf
  name: ManageCaddieRankFees
  description: Setting what each caddie grade is paid.
  global: true
- context: field_extension_golf
  name: ListPayroll
  description: Reading what the caddies are owed. Names against pay, so it is its own permission rather than part of the roster.
  global: true
- context: field_extension_golf
  name: ListSettlement
  description: Reading the month's takings.
  global: true
- context: field_extension_golf
  name: ListBudgets
  description: Reading the daily budgets and how the club is tracking against them.
  global: true
- context: field_extension_golf
  name: ManageBudgets
  description: Setting the daily budgets, by hand or by import.
  global: true
- context: field_extension_golf
  name: CalculateFees
  description: Running fee and golf-course-tax simulations.
  global: true
- context: field_extension_golf
  name: ManageCancellationFees
  description: Collecting a cancellation fee and issuing its invoice.
  global: true
- context: field_extension_golf
  name: ListReservationReports
  description: Reading the reservation reports taken off a spreadsheet.
  global: true
- context: field_extension_golf
  name: ImportReservationReports
  description: Taking a reservation report off a spreadsheet and onto the board.
  global: true
- context: field_extension_golf
  name: ListExtensionStatus
  description: Reading which parts of the golf extension this tenant has switched on.
  global: true
- context: field_extension_golf
  name: SeedDemoBoard
  description: Filling a tenant's board with demo rounds and rosters.
  global: true
- context: field_extension_golf
  name: CalculateTax
  description: Calculate golf extension tax for a TACHYON Field reservation
  global: true
