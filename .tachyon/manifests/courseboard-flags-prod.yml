# CourseBoard が所有するフィーチャーフラグ（本番）。
#
# tn_01hjjn348rn3t49zz6hvmfq67p は Tachyon 本番の platform。**CourseBoard 専用
# ではない。** 同じ platform の配下には他社の Operator も並んでいるので、ここに
# 置いたフラグはその全員から見える。
#
# 見えることと効くことは別で、feature.courseboard.* を読むのは CourseBoard だけ
# なので他社アプリの挙動は変わらない。それでも共有空間なので、接頭辞は必ず
# feature.courseboard. にする（CourseBoard 側の API がそれ以外を拒否する）。
#
# 出し先を絞るときは管理画面で TenantTargeting を設定する。manifest には
# evaluationStrategy を書けない（書くと validation error）。
#
#   札幌カントリー倶楽部       tn_01kxt866zs9vj2p8ks33sfh2eh
#   courseboard               tn_01kxd5gdvm9thcbj8c2e8c6yhq
#
# enabled は書かない。理由はサンドボックス側の manifest と同じ。
#
# name を courseboard-flags-prod にしてあるのは、tachyon.yaml が既に
# courseboard-flags という名前の FeatureFlags を宣言しているため。あちらは
# tenantId が app 所有の Operator（tn_01ks18jhh1xvggktfzjx5jqsen）で、こちらは
# platform。同じ name で tenantId だけ違う 2 つを apply したときにどちらが勝つか、
# prune が何を消すかが読めないので、名前を分けて衝突を避ける。
#
# なお tachyon.yaml 側の flag-evaluation-smoke は Operator テナントに置かれている
# ため、上のとおり評価前に捨てられているはずで、疎通確認として機能していない
# 可能性が高い。1 本へ寄せる整理は他アプリにも影響するので別途相談する。
apiVersion: apps.tachy.one/v1alpha
kind: FeatureFlags
metadata:
  name: courseboard-flags-prod
  tenantId: tn_01hjjn348rn3t49zz6hvmfq67p
spec:
  flags:
    - key: feature.courseboard.reservation-report-import
      name: "予約表のとりこみ"
      description: "既存の予約システムから出した日別予約表を取り込む画面を出す"
