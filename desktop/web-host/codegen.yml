overwrite: true
documents: "./src/**/*.graphql"
schema: "../api/schema.graphql"
generates:
  ./src/gen/graphql.ts:
    plugins:
      - typescript
      - typescript-operations
      - typescript-graphql-request
    config:
      scalars:
        Upload: File
  ./src/gen/graphql-urql.tsx:
    plugins:
      - "typescript"
      - "typescript-operations"
      - "typescript-urql"
