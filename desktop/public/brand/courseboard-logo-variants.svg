<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc">
  <title id="title">Course Board logo variants</title>
  <desc id="desc">Clean preview board for Course Board light, dark, compact, icon, and favicon variants.</desc>
  <defs>
    <style>
      .bg { fill: #f6f8f5; }
      .paper { fill: #ffffff; }
      .night { fill: #0b1114; }
      .stroke { stroke: #e3e8e2; stroke-width: 2; }
      .stroke-dark { stroke: #243137; stroke-width: 2; }
      .soft { fill: #edf2ee; }
    </style>
  </defs>

  <rect width="1800" height="1080" class="bg" />

  <rect x="72" y="64" width="796" height="300" rx="24" class="paper stroke" />
  <image href="courseboard-wordmark.svg" x="158" y="122" width="624" height="172" preserveAspectRatio="xMidYMid meet" />

  <rect x="932" y="64" width="796" height="300" rx="24" class="night stroke-dark" />
  <image href="courseboard-wordmark-dark.svg" x="1018" y="122" width="624" height="172" preserveAspectRatio="xMidYMid meet" />

  <rect x="72" y="426" width="796" height="272" rx="24" class="paper stroke" />
  <image href="courseboard-compact.svg" x="238" y="490" width="420" height="144" preserveAspectRatio="xMidYMid meet" />

  <rect x="932" y="426" width="796" height="272" rx="24" class="night stroke-dark" />
  <image href="courseboard-compact-dark.svg" x="1098" y="490" width="420" height="144" preserveAspectRatio="xMidYMid meet" />

  <rect x="72" y="760" width="512" height="248" rx="24" class="paper stroke" />
  <image href="courseboard-mark.svg" x="234" y="804" width="160" height="160" preserveAspectRatio="xMidYMid meet" />

  <rect x="644" y="760" width="512" height="248" rx="24" class="night stroke-dark" />
  <image href="courseboard-mark-dark.svg" x="806" y="804" width="160" height="160" preserveAspectRatio="xMidYMid meet" />

  <rect x="1216" y="760" width="512" height="248" rx="24" class="paper stroke" />
  <image href="courseboard-favicon.svg" x="1300" y="824" width="96" height="96" preserveAspectRatio="xMidYMid meet" />
  <image href="courseboard-favicon.svg" x="1448" y="840" width="64" height="64" preserveAspectRatio="xMidYMid meet" />
  <image href="courseboard-favicon.svg" x="1560" y="856" width="32" height="32" preserveAspectRatio="xMidYMid meet" />
  <image href="courseboard-favicon.svg" x="1640" y="864" width="16" height="16" preserveAspectRatio="xMidYMid meet" />
</svg>
