version: 0.2

phases:
  build:
    commands:
      - cargo build --release --locked
  post_build:
    commands:
      - |
        set -euo pipefail

        image_name="${IMAGE_NAME:-tachyonfield-golf}"
        image_tag="${IMAGE_TAG:-${INTERNAL_BUILD_ID:-${CODEBUILD_RESOLVED_SOURCE_VERSION:-latest}}}"
        docker_context_path="${CODEBUILD_SRC_DIR:-$(pwd)}"

        if [ -n "${CONTAINER_REGISTRY:-}" ]; then
          image_uri="${CONTAINER_REGISTRY}/${image_name}:${image_tag}"
        else
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          region="${AWS_REGION:-${AWS_DEFAULT_REGION:-ap-northeast-1}}"
          image_uri="${account_id}.dkr.ecr.${region}.amazonaws.com/compute-apps/${image_name}:${image_tag}"
        fi

        registry="${image_uri%%/*}"
        region="${AWS_REGION:-${AWS_DEFAULT_REGION:-ap-northeast-1}}"
        aws ecr get-login-password --region "$region" \
          | docker login --username AWS --password-stdin "$registry"

        env -u DOCKER_CONTEXT docker build \
          -t "$image_uri" \
          -f Dockerfile \
          "$docker_context_path"
        env -u DOCKER_CONTEXT docker push "$image_uri"
